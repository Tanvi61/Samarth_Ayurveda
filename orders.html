<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>My Orders &amp; Tracking | Ayurveda Official Express Delivery</title>
  <meta name="description" content="Track your authentic Ayurveda parcel shipment and live courier status in real-time." />
  
  <!-- Open Graph / Meta -->
  <meta property="og:site_name" content="Ayurveda" />
  <meta property="og:title" content="My Orders & Tracking | Ayurveda" />
  <meta property="og:description" content="Real-time order tracking for your handcrafted herbal hair care." />
  <meta property="og:url" content="https://ayurveda.com/orders.html" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0601/8242/9745/files/Untitled_design_62.png?v=1788326706" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://sonaherbal.com/cdn/shop/files/Sona_s_Logo.png?crop=center&height=32&v=1783538852&width=32" />

  <!-- Preload Bricolage Grotesque Font Files (Official Sona Herbal Typeface) -->
  <link rel="preload" href="/fonts/bricolagegrotesque_n5.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/bricolagegrotesque_n7.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Immediate @font-face declarations for 100% offline & local rendering -->
  <style>
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/bricolagegrotesque_n5.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('/fonts/bricolagegrotesque_n5.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('/fonts/bricolagegrotesque_n7.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('/fonts/bricolagegrotesque_n7.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('/fonts/bricolagegrotesque_n7.woff2') format('woff2');
    }
  </style>

  <!-- Google Fonts: Bricolage Grotesque (Fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./src/styles/variables.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/header.css" />
  <link rel="stylesheet" href="./src/styles/reels.css" />
  <link rel="stylesheet" href="./src/styles/hero.css" />
  <link rel="stylesheet" href="./src/styles/products.css" />
  <link rel="stylesheet" href="./src/styles/luxury3d.css" />
  <link rel="stylesheet" href="./src/styles/reviews.css" />
  <link rel="stylesheet" href="./src/styles/news.css" />
  <link rel="stylesheet" href="./src/styles/faq.css" />
  <link rel="stylesheet" href="./src/styles/founder.css" />
  <link rel="stylesheet" href="./src/styles/promise.css" />
  <link rel="stylesheet" href="./src/styles/footer.css" />
  <link rel="stylesheet" href="./src/styles/cart.css" />
  <link rel="stylesheet" href="./src/styles/pdp.css" />
  <link rel="stylesheet" href="./src/styles/contact.css" />
  <link rel="stylesheet" href="./src/styles/about.css" />
  <link rel="stylesheet" href="./src/styles/orders.css" />
  <link rel="stylesheet" href="./src/styles/account.css" />
  <link rel="stylesheet" href="./src/styles/search.css" />
  <link rel="stylesheet" href="./src/styles/chat.css" />
</head>
<body data-page="orders">

  <div class="page-wrapper">
    <!-- Unified Dynamic Layout Header Root (Single Source of Truth in src/js/layout.js) -->
    <div id="siteHeaderRoot"></div>

    <!-- MAIN CONTENT AREA -->
    <main id="mainContent" class="main-content">
<div class="orders-page-wrapper">
      <!-- Top Brand Header -->
      <header class="orders-page-header">
        <a href="#home" class="orders-brand-logo" data-route="home" title="Go to Ayurveda Home">
          <div class="orders-brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
            </svg>
          </div>
          <div class="orders-brand-text">
            <span class="orders-brand-title">AYURVEDA</span>
            <span class="orders-brand-subtitle">Pure care, naturally</span>
          </div>
        </a>
        <a href="#home" class="orders-back-link" data-route="home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Store</span>
        </a>
      </header>

      <!-- Central Card -->
      <main class="orders-card-container">
        <div class="orders-card">
          <div class="orders-card-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1e5638" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <!-- Isometric Box -->
              <path d="M12 3l8 4.5v7l-8 4.5-8-4.5v-7L12 3z"></path>
              <path d="M12 12l8-4.5"></path>
              <path d="M12 12v7"></path>
              <path d="M12 12L4 7.5"></path>
              <!-- Magnifying Glass -->
              <circle cx="16.5" cy="16.5" r="3" fill="#e6f2eb" stroke="#1e5638" stroke-width="2"></circle>
              <path d="M18.8 18.8L21.5 21.5" stroke="#1e5638" stroke-width="2.2"></path>
            </svg>
          </div>

          <div class="orders-card-eyebrow">ORDER CARE</div>
          <h1 class="orders-card-title">My Orders</h1>
          <p class="orders-card-desc">Enter the mobile number used while placing your order</p>

          <form class="orders-form" id="myOrdersForm" novalidate="">
            <label class="orders-input-label" for="ordersMobileInput">Mobile number</label>
            <div class="orders-input-group" id="ordersInputGroup">
              <div class="orders-prefix">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                </svg>
                <span>+91</span>
              </div>
              <input type="tel" id="ordersMobileInput" class="orders-input" placeholder="Mobile Number" maxlength="14" inputmode="numeric" autocomplete="tel" required="">
            </div>
            <div class="orders-helper-text" id="ordersHelperText">Use the same number you entered at checkout</div>

            <button type="submit" class="orders-submit-btn" id="ordersSubmitBtn">
              <span>View My Orders</span>
            </button>

            <div class="orders-security-notice">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>Your order details are shown securely. Addresses and payment details are never displayed.</span>
            </div>
          </form>

          <div id="ordersResultArea" class="orders-result-container" style="display: none;"></div>
        </div>
    </main>

    <!-- Unified Dynamic Layout Footer Root (Single Source of Truth in src/js/footer.js) -->
    <div id="siteFooterRoot"></div>
  </div>

  <!-- Unified Dynamic Layout Modals & Floating Root (Single Source of Truth in src/js/layout.js) -->
  <div id="siteModalsRoot"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
